# CI gate of the M3 contract (docs/ARCHITECTURE.md §4, docs/DECISIONS.md D17): the test suite on the
# oldest and newest supported Python, the spec §8 benchmark gated on the full-render target only
# (`--gate full`; the camera-only row is informational until M7) and, on one interpreter, a dry run of
# the conformance regeneration tool.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install cairo (optional PNG extra of the dev dependencies)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - name: Install the package with the dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test suite
        run: python -m pytest -q
      - name: Spec §8 benchmark (full-render gate; camera-only row informational, D17)
        run: python3 benchmarks/bench.py --gate full
      - name: Conformance dry run (reports drift against the recorded NumPy build, never fails on it)
        # `--reason` is mandatory even for a dry run (exit 2 without it); the dry run writes nothing and
        # exits 0 whether or not expected files would change (exit 1 only for an unknown case or a render
        # error).  Drift on another NumPy build is tolerated: tests/test_conformance.py already requires
        # every drifted case to stay within the §7.5 tolerances.
        if: matrix.python-version == '3.13'
        run: python3 tools/regen_conformance.py --reason "CI dry run" --dry-run
